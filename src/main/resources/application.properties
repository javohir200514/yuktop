vaadin.launch-browser=${VAADIN_LAUNCH_BROWSER:true}
spring.application.name=one-time-courier

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/one-time-currier}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:b7_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
vaadin.productionMode=${VAADIN_PRODUCTION_MODE:true}
server.port=${PORT:8087}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

telegram.bot.username=${TELEGRAM_BOT_USERNAME:yuk_top_uzb_bot}
telegram.bot.token=${TELEGRAM_BOT_TOKEN}

# Proxy (Render/Railway/nginx) orqasida to'g'ri https, host va mijoz IP si
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax